# Hermes Control Plane — MongoDB replica set (HA) for remote agent state.
#
# Install:  ../../scripts/install-control-plane.sh
# Enroll:   ./scripts/enroll-agent.sh --name home-pc

services:
  mongo1:
    image: mongo:7
    container_name: hermes-mongo1
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27017"
      - --tlsMode
      - preferTLS
      - --tlsCertificateKeyFile
      - /certs/mongo-server.pem
      - --tlsCAFile
      - /certs/ca.crt
      - --auth
      - --keyFile
      - /certs/mongo-keyfile
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo2:
    image: mongo:7
    container_name: hermes-mongo2
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27017"
      - --tlsMode
      - preferTLS
      - --tlsCertificateKeyFile
      - /certs/mongo-server.pem
      - --tlsCAFile
      - /certs/ca.crt
      - --auth
      - --keyFile
      - /certs/mongo-keyfile
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
      - ./certs:/certs:ro
    depends_on:
      - mongo1

  mongo3:
    image: mongo:7
    container_name: hermes-mongo3
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27017"
      - --tlsMode
      - preferTLS
      - --tlsCertificateKeyFile
      - /certs/mongo-server.pem
      - --tlsCAFile
      - /certs/ca.crt
      - --auth
      - --keyFile
      - /certs/mongo-keyfile
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
      - ./certs:/certs:ro
    depends_on:
      - mongo1

  enroll:
    image: python:3.12-slim
    container_name: hermes-enroll
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - ./certs:/certs
      - ./bundles:/bundles
    ports:
      - "8743:8743"
    environment:
      HERMES_ENROLL_TOKEN: ${HERMES_ENROLL_TOKEN:-}
      HERMES_MONGO_HOSTS: ${HERMES_MONGO_HOSTS:-host.docker.internal:27017,host.docker.internal:27018,host.docker.internal:27019}
      HERMES_REPLICA_SET: rs0
      HERMES_CONTROL_DIR: /app
      HERMES_ORCHESTRATOR_URL: ${HERMES_ORCHESTRATOR_URL:-https://host.docker.internal:8744}
    command: ["python", "scripts/enroll_standalone.py", "serve"]
    profiles: ["enroll"]

  # mTLS orchestrator — agents without a CA-signed client cert are dropped
  orchestrator:
    image: python:3.12-slim
    container_name: hermes-orchestrator
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - ./certs:/certs:ro
    ports:
      - "8744:8744"
    environment:
      HERMES_CONTROL_DIR: /app
      HERMES_ORCHESTRATOR_PORT: "8744"
      HERMES_MONGO_HOSTS: mongo1:27017,mongo2:27017,mongo3:27017
      HERMES_REPLICA_SET: rs0
      HERMES_SHARED_DB: hermes_shared
    command: ["python", "scripts/orchestrator_server.py"]
    depends_on:
      - mongo1

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
